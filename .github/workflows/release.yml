name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate versions and package themes
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build='[0-9A-Za-z-]+'
          semver="^$number\.$number\.$number(-$identifier(\.$identifier)*)?(\+$build(\.$build)*)?$"
          version_key() {
            [[ "$1" =~ $semver ]] || return 1
            jq -cn --arg version "${1%%+*}" '
              $version | capture("^(?<core>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-(?<pre>.+))?$")
              | [
                  (.core | split(".") | map([length, .])),
                  if .pre == null then [1] else
                    [0, (.pre | split(".") | map(
                      if test("^[0-9]+$") then [0, length, .] else [1, .] end
                    ))]
                  end
                ]
            '
          }
          if [[ "$RELEASE_TAG" != v* ]] || ! current_key=$(version_key "${RELEASE_TAG#v}"); then
            echo "Invalid SemVer release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          previous=
          previous_key=null
          # Only lower versions reachable from this commit can be a baseline.
          while IFS= read -r tag; do
            key=$(version_key "${tag#v}") || continue
            if jq -en --argjson key "$key" --argjson current "$current_key" \
              --argjson previous "$previous_key" \
              '$key < $current and ($previous == null or $key > $previous)' >/dev/null; then
              previous=$tag
              previous_key=$key
            fi
          done < <(git tag --merged HEAD --sort=refname --list 'v*')

          printf '## Themes\n\n' > release-notes.txt
          if [[ -n "$previous" ]]; then
            printf 'Compared with %s.\n\n' "$previous" >> release-notes.txt
          else
            printf 'First collection release.\n\n' >> release-notes.txt
          fi
          printf '| Theme | Version | Status |\n|-------|---------|--------|\n' >> release-notes.txt
          work=$(mktemp -d)
          trap 'rm -r "$work"' EXIT
          git archive HEAD themes LICENSE | tar -x -C "$work"
          if [[ -n "$(find "$work/themes" -type l -print -quit)" ]]; then
            echo "Theme archives must contain real files, not symlinks" >&2
            exit 1
          fi
          dist="$PWD/dist"
          mkdir "$dist"
          for theme in "$work"/themes/*/; do
            name=$(basename "$theme")
            version=$(jq -er '.version | strings' "$theme/theme.json")
            key=$(version_key "$version") || {
              echo "Invalid theme version: $name ($version)" >&2
              exit 1
            }
            status=Added
            if [[ -n "$previous" ]] && git cat-file -e "$previous:themes/$name/theme.json" 2>/dev/null; then
              old_version=$(git show "$previous:themes/$name/theme.json" | jq -er '.version | strings')
              old_key=$(version_key "$old_version")
              status=Unchanged
              if ! git diff --quiet "$previous" HEAD -- "themes/$name"; then
                status=Changed
                if ! jq -en --argjson current "$key" --argjson previous "$old_key" \
                  '$current > $previous' >/dev/null; then
                  echo "$name changed since $previous; increase its theme.json version ($old_version)" >&2
                  exit 1
                fi
              fi
            fi
            printf '| %s | %s | %s |\n' "$name" "$version" "$status" >> release-notes.txt
            cp -p "$work/LICENSE" "$theme/LICENSE"
            (
              cd "$work/themes" || exit
              export TZ=UTC
              find "$name" -type f | LC_ALL=C sort | zip -q -X "$dist/$name.zip" -@
            )
          done
          (cd "$dist" && sha256sum ./*.zip > checksums.txt)
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.4
      - name: Sign and verify assets
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for asset in dist/*.zip dist/checksums.txt; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob "$asset" --bundle "$asset.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${RELEASE_TAG#v}
          version=${version%%+*}
          if [[ "$version" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "$RELEASE_TAG" --notes-file release-notes.txt "${flags[@]}"
